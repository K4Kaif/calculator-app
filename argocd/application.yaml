apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calculator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/K4Kaif/calculator-app.git
    targetRevision: main
    path: helm/calculator
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
