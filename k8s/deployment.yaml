apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      containers:
        - name: calculator
          image: k4kaif/calculator:059fc31e1b06404b1079b69bc261b48b6b4251bb
          ports:
            - containerPort: 80
